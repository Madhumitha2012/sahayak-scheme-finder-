<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahayak — Find Government Schemes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">स</span>
      <div class="brand-text">
        <h1>Sahayak</h1>
        <p id="tagline">Find government schemes you may qualify for</p>
      </div>
    </div>
    <select id="langSelect" class="lang-select" aria-label="Choose language"></select>
  </header>

  <div class="translate-bar">
    <span class="translate-label">Translate results:</span>
    <div id="google_translate_element"></div>
  </div>

  <main class="chat-shell">
    <div id="chat" class="chat" aria-live="polite"></div>
  </main>

  <div class="input-bar" id="inputBar" style="display:none;">
    <button id="micBtn" class="mic-btn" title="Speak">🎤</button>
    <input id="textInput" class="text-input" type="text" placeholder="Type or speak here..." />
    <button id="sendBtn" class="send-btn">Send</button>
  </div>

  <footer class="footnote">
    Results are pulled live via SerpApi's Google Search, filtered toward official
    <span>.gov.in</span> and <span>.nic.in</span> sources. Use the translate bar above
    to translate result text into your language.
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        { pageLanguage: 'en', includedLanguages: 'hi,ta,kn,mr,en', autoDisplay: false },
        'google_translate_element'
      );
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
